name: Continuous Integration

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Java 17
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x back/gradlew

      - name: Build, test and generate JaCoCo reports
        working-directory: back
        run: ./gradlew clean build jacocoTestReport --no-daemon

      - name: Upload backend test and coverage reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: backend-test-and-coverage
          if-no-files-found: warn
          path: |
            back/build/test-results/test
            back/build/reports/jacoco/test
            back/build/classes/java/main
            back/build/classes/java/test

  frontend:
    name: Frontend build and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js 20
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies
        working-directory: front
        run: npm ci

      - name: Build Angular application
        working-directory: front
        run: npm run build

      - name: Run headless tests and generate coverage
        working-directory: front
        run: npm test -- --watch=false --browsers=ChromeHeadless --code-coverage

      - name: Upload frontend test and coverage reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: frontend-test-and-coverage
          if-no-files-found: warn
          path: |
            front/test-results
            front/coverage

  sonar:
    name: SonarCloud analysis and Quality Gate
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Download backend reports
        uses: actions/download-artifact@v5
        with:
          name: backend-test-and-coverage
          path: back/build

      - name: Download frontend reports
        uses: actions/download-artifact@v5
        with:
          name: frontend-test-and-coverage
          path: front

      - name: SonarCloud scan and Quality Gate
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  container-build:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [backend, frontend, sonar]

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.1.0

      - name: Build Docker Compose services
        run: docker compose build
