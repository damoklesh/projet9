name: Continuous Integration

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x back/gradlew

      - name: Build, test and generate JaCoCo reports
        working-directory: back
        run: ./gradlew clean build jacocoTestReport --no-daemon

      - name: Upload backend test and coverage reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-and-coverage
          if-no-files-found: warn
          path: |
            back/build/test-results/test
            back/build/reports/jacoco/test

  frontend:
    name: Frontend build and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies
        working-directory: front
        run: npm ci

      - name: Build Angular application
        working-directory: front
        run: npm run build

      - name: Run headless tests and generate coverage
        working-directory: front
        run: npm test -- --watch=false --browsers=ChromeHeadless --code-coverage

      - name: Upload frontend test and coverage reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-and-coverage
          if-no-files-found: warn
          path: |
            front/test-results
            front/coverage
