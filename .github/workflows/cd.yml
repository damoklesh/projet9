name: Continuous Deployment

on:
  workflow_run:
    workflows:
      - Continuous Integration
    types:
      - completed

jobs:
  publish:
    name: Publish Docker images to GHCR
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.1.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v7.4.0
        with:
          context: ./front
          file: ./front/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/orion-microcrm-front:sha-${{ github.event.workflow_run.head_sha }}
            ghcr.io/${{ github.repository_owner }}/orion-microcrm-front:main

      - name: Build and push backend image
        uses: docker/build-push-action@v7.4.0
        with:
          context: ./back
          file: ./back/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/orion-microcrm-back:sha-${{ github.event.workflow_run.head_sha }}
            ghcr.io/${{ github.repository_owner }}/orion-microcrm-back:main
