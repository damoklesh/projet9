services:
  back:
    build:
      context: ./back
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    networks:
      - microcrm

  front:
    build:
      context: ./front
      dockerfile: Dockerfile
    depends_on:
      - back
    ports:
      - "80:8080"
    networks:
      - microcrm

networks:
  microcrm:
    driver: bridge
