services:
  back:
    build:
      context: ./back
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      LOGSTASH_HOST: host.docker.internal
      LOGSTASH_PORT: ${LOGSTASH_HOST_PORT:-5001}
      MICROCRM_ENVIRONMENT: docker
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - microcrm

  front:
    build:
      context: ./front
      dockerfile: Dockerfile
    depends_on:
      - back
    ports:
      - "80:8080"
    volumes:
      - ./runtime-logs:/var/log/caddy
    networks:
      - microcrm

networks:
  microcrm:
    driver: bridge
